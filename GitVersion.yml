assembly-versioning-scheme: MajorMinorPatch
mode: Mainline
branches:
  master:
    regex: ^master$|^main$|^release$
    increment: Minor
    is-source-branch-for: ["major", "minor", "patch"]
    is-mainline: true
  major:
    regex: ^major[/-]
    increment: Major
    source-branches: ["release"]
  minor:
    regex: ^minor[/-]
    increment: Minor
    source-branches: ["release"]
  patch:
    regex: ^patch[/-]
    increment: Patch
    source-branches: ["release"]
ignore:
  sha: []
merge-message-formats: {}
